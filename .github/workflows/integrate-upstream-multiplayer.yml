name: Integrate upstream main (isolated)
on:
  push:
    branches:
      - integration/upstream-main-multiplayer
    paths:
      - .github/workflows/integrate-upstream-multiplayer.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/upstream-main-multiplayer
          fetch-depth: 0
      - name: Merge upstream on the isolated integration branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/adriadam10/mkw-recomp.git
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Upstream main is already integrated"
            exit 0
          fi
          # Resolve overlapping text hunks in favor of the existing multiplayer implementation,
          # while bringing in all upstream-only changes. Never overwrite the feature branch.
          if ! git merge --no-commit --no-ff -X ours upstream/main; then
            # Upstream moved the legacy C test directory to tests/runtime.
            # Preserve the source-side README and stage the new upstream paths;
            # the merge has already combined any non-overlapping changes.
            unresolved="$(git diff --name-only --diff-filter=U)"
            expected="$(printf '%s\\n' tests/c/README.md tests/runtime/t_net_listen.c tests/runtime/t_srv.c)"
            if [ "$(printf '%s\\n' "$unresolved" | sort)" != "$(printf '%s\\n' "$expected" | sort)" ]; then
              echo "::error::Unexpected merge conflicts:"
              printf '%s\\n' "$unresolved"
              git status --short
              exit 1
            fi
            if grep -E -n '^(<<<<<<< |=======|>>>>>>> )' tests/runtime/t_net_listen.c tests/runtime/t_srv.c; then
              echo "::error::Conflict markers in moved test sources"
              exit 1
            fi
            git add tests/c/README.md tests/runtime/t_net_listen.c tests/runtime/t_srv.c
            echo "Resolved the three directory-move conflicts; preserving the merged test files."
          fi
          if test -n "$(git diff --name-only --diff-filter=U)"; then
            echo "::error::Unresolved paths remain"
            git diff --name-only --diff-filter=U
            exit 1
          fi
          git commit -m "chore(multiplayer): integrate upstream main preserving feature-side overlap"
          git push origin HEAD:integration/upstream-main-multiplayer
