name: Integrate upstream main (isolated)
on:
  push:
    branches:
      - integration/upstream-main-multiplayer
    paths:
      - .github/workflows/integrate-upstream-multiplayer.yml
  workflow_dispatch:
permissions:
  contents: write
jobs:
  merge:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/upstream-main-multiplayer
          fetch-depth: 0
      - name: Merge upstream on the isolated integration branch
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote add upstream https://github.com/adriadam10/mkw-recomp.git
          git fetch upstream main
          if git merge-base --is-ancestor upstream/main HEAD; then
            echo "Upstream main is already integrated"
            exit 0
          fi
          # Resolve overlapping text hunks in favor of the existing multiplayer implementation,
          # while bringing in all upstream-only changes. Never overwrite the feature branch.
          if ! git merge --no-commit --no-ff -X ours upstream/main; then
            # Upstream moved the legacy C test directory to tests/runtime.
            # Preserve the source-side README and stage the new upstream paths;
            # the merge has already combined any non-overlapping changes.
            unresolved="$(git diff --name-only --diff-filter=U)"
            expected="$(printf '%s\n' tests/c/README.md tests/runtime/t_net_listen.c tests/runtime/t_srv.c)"
            if [ "$(printf '%s\n' "$unresolved" | sort)" != "$(printf '%s\n' "$expected" | sort)" ]; then
              echo "::error::Unexpected merge conflicts:"
              printf '%s\n' "$unresolved"
              git status --short
              exit 1
            fi
            if grep -E -n '^(<<<<<<< |=======|>>>>>>> )' tests/runtime/t_net_listen.c tests/runtime/t_srv.c; then
              echo "::error::Conflict markers in moved test sources"
              exit 1
            fi
            git add tests/c/README.md tests/runtime/t_net_listen.c tests/runtime/t_srv.c
            echo "Resolved the three directory-move conflicts; preserving the merged test files."
          fi
          if test -n "$(git diff --name-only --diff-filter=U)"; then
            echo "::error::Unresolved paths remain"
            git diff --name-only --diff-filter=U
            exit 1
          fi
          # The workflow token cannot modify workflow files. Keep this branch's workflows;
          # merge all other upstream code, then review upstream workflow changes separately.
          git restore --source=HEAD --staged --worktree -- .github/workflows/
          git commit -m "chore(multiplayer): integrate upstream main preserving feature-side overlap"
          git push origin HEAD:integration/upstream-main-multiplayer

  layout:
    needs: merge
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/upstream-main-multiplayer
          fetch-depth: 0
      - name: Adopt upstream documentation and test layout
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if test -f docs/project/multiplayer.md; then
            echo "Layout already migrated"
            exit 0
          fi
          git fetch https://github.com/adriadam10/mkw-recomp.git main
          git show FETCH_HEAD:docs/README.md > docs/README.md
          git show FETCH_HEAD:tests/README.md > tests/README.md
          git mv docs/multiplayer.md docs/project/multiplayer.md
          sed -i 's@../tools/@../../tools/@g; s@../runtime/@../../runtime/@g; s@../tests/@../../tests/@g' docs/project/multiplayer.md
          for p in test_lan_peers.py test_net_invite.py test_net_listen.py test_online_clock.py test_online_friends.py test_online_input.py test_srv.py; do
            git mv "tests/$p" "tests/runtime/$p"
            sed -i 's@parents\[1\]@parents[2]@g; s@tests/c/@tests/runtime/@g' "tests/runtime/$p"
          done
          git rm tests/c/README.md
          printf '\n| [multiplayer.md](multiplayer.md) | Experimental F1 online server, VPN setup and real two-PC acceptance test |\n' >> docs/project/README.md
          printf '\n| llvm_clang.py | Shared LLVM/Clang compiler setup helpers for Windows and Linux builds | Internal build helper |\n' >> tools/build/README.md
          printf '\n| t_net_listen.c | test_net_listen.py | Debounced address changes and server listener restart |\n| t_srv.c | test_srv.py | Online server protocol, Gamesync, sessions and referee |\n' >> tests/runtime/README.md
          printf '\nOnline protocol regressions in this folder: test_lan_peers.py, test_net_invite.py, test_net_listen.py, test_online_clock.py, test_online_friends.py, test_online_input.py, and test_srv.py.\n' >> tests/runtime/README.md
          git add -A
          git commit -m "refactor(multiplayer): align tests and docs with upstream layout"
          git push origin HEAD:integration/upstream-main-multiplayer

  validate:
    needs: layout
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: integration/upstream-main-multiplayer
      - uses: astral-sh/setup-uv@v6
      - name: Validate layout, settings and Python
        run: |
          uv run ruff check tools sm86
          uv run tools/docs/check.py
          uv run tools/git/cfg_rows.py
          uv run pytest tests/runtime/test_online_clock.py tests/runtime/test_lan_peers.py tests/runtime/test_net_invite.py tests/runtime/test_net_listen.py
