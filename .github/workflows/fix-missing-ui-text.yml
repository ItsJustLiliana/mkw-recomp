name: Fix missing UI text from upstream
on:
  push:
    branches: [fix/windows-build-missing-ui-text]
    paths: [.github/workflows/fix-missing-ui-text.yml]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: fix/windows-build-missing-ui-text
      - name: Restore catalog identifiers and translations
        shell: bash
        run: |
          set -euo pipefail
          git fetch https://github.com/adriadam10/mkw-recomp.git main
          git show FETCH_HEAD:i18n/ui/mkw.pot > "$RUNNER_TEMP/upstream-mkw.pot"
          python - "$RUNNER_TEMP/upstream-mkw.pot" <<'PY'
          import pathlib, re, sys
          keys = (
              "UI_MENU_START_ALWAYS", "UI_MENU_START_SKIP",
              "UI_MENU_START_SCREEN", "UI_MENU_START_SCREEN_DESC",
              "UI_LAUNCH_FILES_GONE", "UI_SETUP_ERR_SPACE",
              "UI_LAUNCH_FOUND_SEARCHING", "UI_LAUNCH_FOUND",
              "UI_LAUNCH_FOUND_FOLDER", "UI_LAUNCH_FILES_GONE_HELP",
          )
          pot = pathlib.Path(sys.argv[1]).read_text(encoding="utf-8")
          blocks = {}
          for key in keys:
              match = re.search(r'(?m)^msgctxt "' + re.escape(key) + r'"\n.*?(?=\n\n|\Z)', pot, re.S)
              if not match or 'msgstr ""' not in match.group():
                  raise RuntimeError("upstream text missing: " + key)
              blocks[key] = match.group().strip()
          header_path = pathlib.Path("runtime/gfx/nvn/host/ui_text.h")
          header = header_path.read_text(encoding="utf-8")
          marker = "    UI_MENU_LAST_ID = UI_F1_PARTY_NONE,"
          if marker not in header:
              raise RuntimeError("unexpected UI enum layout")
          header = header.replace(marker,
              "    // Text added upstream, placed after multiplayer IDs to keep existing values stable.\n"
              "    " + ", ".join(keys) + ",\n"
              "    UI_MENU_LAST_ID = UI_LAUNCH_FILES_GONE_HELP,")
          header_path.write_text(header, encoding="utf-8")
          for path in sorted(pathlib.Path("i18n/ui").glob("*.po*")):
              contents = path.read_text(encoding="utf-8")
              for key in keys:
                  if 'msgctxt "' + key + '"' not in contents:
                      contents = contents.rstrip() + "\n\n" + blocks[key] + "\n"
              path.write_text(contents, encoding="utf-8")
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add runtime/gfx/nvn/host/ui_text.h i18n/ui/
          git commit -m "fix(ui): restore upstream launcher text IDs and catalog entries"
          git push origin HEAD:fix/windows-build-missing-ui-text
